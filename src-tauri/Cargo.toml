[package]
name = "auto-browser"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "A local-first desktop browser for your own AI agents"
repository = "https://github.com/YoungWWan/auto-browser"
default-run = "auto-browser"

[lib]
name = "auto_browser_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
