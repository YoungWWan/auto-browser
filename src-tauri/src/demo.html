<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>客户工作台 · 练习页面</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f7f3;
        color: #242d27;
        font:
          15px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 24px;
        background: #fff;
        border-bottom: 1px solid #e4e6df;
        font-size: 13px;
      }
      header small {
        color: #62675e;
        font-size: 12px;
      }
      main {
        max-width: 760px;
        margin: 18px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.35;
        margin: 0 0 6px;
      }
      p {
        color: #62675e;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      .form {
        background: #fff;
        border: 1px solid #e4e6df;
        border-radius: 8px;
        padding: 20px;
        margin-top: 16px;
      }
      .form-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 20px;
      }
      .field {
        min-width: 0;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 6px;
      }
      input:not([type="checkbox"]),
      select {
        width: 100%;
        height: 40px;
        padding: 8px 10px;
        border: 1px solid #dce0d6;
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid #769a3d;
        outline-offset: 3px;
      }
      .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0;
        font-weight: 400;
      }
      .check input {
        margin: 0;
        width: 16px;
        height: 16px;
        accent-color: #2d412f;
      }
      button {
        min-width: 130px;
        min-height: 44px;
        padding: 10px 20px;
        border: 0;
        border-radius: 5px;
        background: #2d412f;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #243626;
      }
      #result {
        color: #356224;
        background: #edf4e3;
        padding: 12px;
        border-radius: 5px;
        margin-top: 14px;
        font-size: 14px;
      }
      #result:empty {
        display: none;
      }
      footer {
        margin-top: 14px;
        font-size: 12px;
        color: #62675e;
        line-height: 1.6;
      }
      @media (max-width: 560px) {
        header {
          padding: 14px 18px;
          flex-wrap: wrap;
          gap: 5px 16px;
        }
        main {
          padding: 0 18px;
        }
        .form {
          padding: 16px;
        }
        .form-fields {
          grid-template-columns: minmax(0, 1fr);
        }
        .form-actions {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>本地练习 · 客户表单</strong>
    </header>
    <main>
      <h1>添加一位新客户</h1>
      <p>填写表单，试跑网页录制与保存。</p>
      <form class="form" id="customer-form">
        <div class="form-fields">
          <div class="field">
            <label for="name">客户姓名</label
            ><input id="name" name="name" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="email">邮箱</label
            ><input id="email" name="email" type="email" required />
          </div>
          <div class="field">
            <label for="company">公司</label
            ><input id="company" name="company" />
          </div>
          <div class="field">
            <label for="type">客户类型</label
            ><select id="type">
              <option value="personal">个人客户</option>
              <option value="business">企业客户</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <label class="check"
            ><input id="updates" type="checkbox" />接收产品更新</label
          >
          <button type="submit">保存客户</button>
        </div>
        <div id="result" role="status"></div>
      </form>
      <footer>练习仅保存在当前页面，不提交到外部系统。</footer>
    </main>
    <script>
      document
        .getElementById("customer-form")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          document.getElementById("result").textContent =
            "已保存：" +
            document.getElementById("name").value +
            " · 编号 DEMO-" +
            Date.now().toString().slice(-6);
        });
    </script>
  </body>
</html>
