name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.3.1)
        required: true
        type: string
  push:
    tags: ["v*"]

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run check:version
      - name: Verify selected release tag matches application version
        run: node --eval "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) throw new Error('Release tag does not match package version')"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers with bundled MCP agent and Skill
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Collect and verify installer formats
        run: node scripts/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish all platforms
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts/release
          merge-multiple: true
      - run: node scripts/release-checksums.mjs
      - name: Publish preview release only after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --title "Auto Browser $RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease
